[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amihacked"
version = "0.4.1"
description = "Local endpoint triage, suspicious behavior detection, and evidence collection."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jinja2>=3.1",
  "psutil>=5.9",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "rich>=13.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
amihacked = "amihacked.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
amihacked = ["reporting/templates/*.j2"]
